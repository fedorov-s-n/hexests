name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# The reusable workflow needs write access; a caller cannot grant more than it
# holds, so declare it here or the call fails at startup on a read-only default.
permissions:
  contents: write

jobs:
  preview:
    uses: fedorov-s-n/gh-agent-preview/.github/workflows/preview.yml@main
    with:
      build_command: "npm ci"
      output_dir: target
      node_version: "20"
      entry_path: "html/"
