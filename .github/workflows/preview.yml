name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    uses: fedorov-s-n/gh-agent-preview/.github/workflows/preview.yml@main
    with:
      build_command: "npm ci"
      output_dir: target
      node_version: "20"
      entry_path: "html/"
